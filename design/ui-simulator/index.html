<title>NAVAQ Glass Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone simulator centred on the stage; wallpaper blobs under glass panels, One UI style large title, floating nav, mini-player, full-screen player sheet, stacked settings pages. */
:root{
  --bg:#eceff6; --outer:#dde2ee; --fg:#10131c; --fg2:rgba(16,19,28,.62);
  --glass-rgb:255,255,255; --line:rgba(255,255,255,.7); --shadow:0 10px 34px rgba(30,40,80,.16);
  --accent:#3e91ff; --accent-fg:#fff; --blur:28px; --ga:.45; --r:24px; --fs:1; --art-r:22%; --rowpad:10px;
  --h1:212; --h2:268; --h3:172; --sat:85%; --blob:.55;
  --font:"Vazirmatn",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07080d; --outer:#030409; --fg:#f2f4fb; --fg2:rgba(242,244,251,.62);
  --glass-rgb:24,27,40; --line:rgba(255,255,255,.14); --shadow:0 12px 40px rgba(0,0,0,.45); --blob:.75; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07080d; --outer:#030409; --fg:#f2f4fb; --fg2:rgba(242,244,251,.62);
  --glass-rgb:24,27,40; --line:rgba(255,255,255,.14); --shadow:0 12px 40px rgba(0,0,0,.45); --blob:.75; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--fg);font-family:var(--font);overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{height:100%;display:grid;place-items:center;padding:14px}
.phone{position:relative;overflow:hidden;width:min(100%,412px);height:min(100%,860px);border-radius:46px;border:1px solid var(--line);
  box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 8px rgba(120,130,160,.12);background:var(--bg);font-size:calc(14px*var(--fs));direction:rtl;isolation:isolate}
@media (max-width:480px){.stage{padding:0}.phone{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}}
.glass{background:rgba(var(--glass-rgb),var(--ga));-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.phone[data-glow="1"] .glass{box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent),0 0 26px color-mix(in srgb,var(--accent) 22%,transparent)}
.wall{position:absolute;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.b{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;filter:blur(52px);opacity:var(--blob);transition:background .8s}
.b1{top:-14%;right:-22%;background:hsl(var(--h1) var(--sat) 56%);animation:fl1 20s ease-in-out infinite alternate}
.b2{bottom:6%;left:-30%;background:hsl(var(--h2) var(--sat) 52%);animation:fl2 24s ease-in-out infinite alternate}
.b3{top:38%;right:-10%;width:50%;background:hsl(var(--h3) var(--sat) 58%);animation:fl1 17s ease-in-out infinite alternate-reverse}
@keyframes fl1{to{transform:translate(-12%,14%) scale(1.15)}}
@keyframes fl2{to{transform:translate(16%,-10%) scale(.9)}}
.phone.noanim *,.phone.noanim *::before{animation:none!important;transition:none!important}
.sb{position:absolute;top:0;inset-inline:0;height:34px;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:.82em;font-weight:600;z-index:60;pointer-events:none}
.sb i{position:absolute;left:50%;top:9px;width:11px;height:11px;border-radius:50%;background:#000;transform:translateX(-50%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:34px}
.scroll{flex:1;overflow-y:auto;padding:0 16px 176px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hd{padding:8px 20px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:padding .25s}
.big{font-size:2.35em;font-weight:700;letter-spacing:-.01em;margin:0;transition:font-size .25s}
.hd.sm .big{font-size:1.25em}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:rgba(var(--glass-rgb),.5)}
.ib svg,.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 20px 12px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:999px;white-space:nowrap;font-weight:500;background:rgba(var(--glass-rgb),calc(var(--ga) * .8));border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.actrow{display:flex;gap:10px;margin:2px 0 12px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:calc(var(--r)*.8);font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.tr{display:flex;align-items:center;gap:12px;padding:var(--rowpad) 6px;border-radius:calc(var(--r)*.7);cursor:pointer;transition:background .2s}
.tr:hover{background:rgba(var(--glass-rgb),.35)}
.tr.cur{background:rgba(var(--glass-rgb),.5)}
.tr.cur .ti b{color:var(--accent)}
.cv{width:52px;height:52px;flex:none;border-radius:var(--art-r);position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cv::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 25% 15%,rgba(255,255,255,.5),transparent 60%)}
.cv svg{position:absolute;inset:28%;width:44%;height:44%;fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;z-index:1}
.ti{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ti b{font-weight:600;font-size:1.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti span{color:var(--fg2);font-size:.86em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;gap:2px;align-items:flex-end;height:16px;width:18px}
.bars i{flex:1;background:var(--accent);border-radius:2px;animation:bar 0.9s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:-.3s}.bars i:nth-child(3){animation-delay:-.6s}
.bars.pz i{animation-play-state:paused;height:30%}
@keyframes bar{from{height:20%}to{height:100%}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.card .cv{width:100%;height:auto;aspect-ratio:1}
.card b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--fg2);font-size:.85em}
.gen{border-radius:var(--r);padding:18px 14px;font-weight:700;font-size:1.05em;min-height:84px;display:flex;align-items:flex-end;color:#fff;cursor:pointer;position:relative;overflow:hidden}
.nav{position:absolute;z-index:20;bottom:14px;left:14px;right:14px;height:64px;display:flex;justify-content:space-around;align-items:center;padding:6px}
.phone[data-nav="docked"] .nav{bottom:0;left:0;right:0;border-radius:var(--r) var(--r) 0 0;height:74px;padding-bottom:12px}
.nv{flex:1;height:100%;border-radius:calc(var(--r)*.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78em;color:var(--fg2);transition:background .25s,color .25s}
.nv.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);font-weight:600}
.mini{position:absolute;z-index:19;left:14px;right:14px;bottom:90px;height:64px;display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;overflow:hidden}
.phone[data-nav="docked"] .mini{bottom:84px}
.mini .cv{width:46px;height:46px}
.mini .pr{position:absolute;bottom:0;left:0;height:3px;background:var(--accent);width:0;transition:width .25s linear}
.player{position:absolute;inset:0;z-index:40;transform:translateY(104%);transition:transform .5s cubic-bezier(.2,.85,.2,1);display:flex;flex-direction:column;padding:42px 22px 22px;
  background:radial-gradient(120% 70% at 50% 0,hsl(var(--ph) 75% 48%/.85),transparent 65%),radial-gradient(90% 60% at 0 100%,hsl(calc(var(--ph) + 70) 70% 45%/.55),transparent 70%),var(--bg)}
.player.open{transform:none}
.ptop{display:flex;align-items:center;justify-content:space-between}
.ptop small{color:var(--fg2);font-weight:500}
.stagep{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative}
.art{width:min(76%,38vh);aspect-ratio:1;transition:transform .6s cubic-bezier(.3,1.4,.4,1),border-radius .4s;transform:scale(.88)}
.art.pl{transform:scale(1)}
.art .cv{width:100%;height:100%;box-shadow:0 22px 60px rgba(0,0,0,.45)}
.art .cv svg{inset:30%;width:40%;height:40%}
.art.spin .cv{animation:spin 14s linear infinite}
.art.spin:not(.pl) .cv{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.viz{width:100%;height:56px;display:block}
.pmeta{display:flex;align-items:center;gap:10px;margin-top:6px}
.pmeta .ti b{font-size:1.4em}
.seekw{margin-top:6px}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;direction:ltr;margin:0}
.seek::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--p,0%),rgba(var(--glass-rgb),.55) var(--p,0%))}
.seek::-moz-range-track{height:6px;border-radius:6px;background:rgba(var(--glass-rgb),.55)}
.seek::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.seek::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;color:var(--fg2);font-size:.8em;direction:ltr;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
.ctl .ib{width:48px;height:48px}
.ctl .ib svg{width:26px;height:26px}
.ctl .ib.on{color:var(--accent)}
.playb{width:72px!important;height:72px!important;background:var(--accent);color:var(--accent-fg);box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 55%,transparent)}
.playb svg{fill:currentColor;stroke:none;width:30px!important;height:30px!important}
.tools{display:flex;justify-content:space-around;padding:8px;margin-top:6px}
.tools .ib.on{color:var(--accent)}
.lyr{width:100%;overflow-y:auto;max-height:100%;text-align:center;padding:10px 4px;scrollbar-width:none}
.lyr p{margin:0 0 14px;font-size:1.35em;font-weight:600;color:var(--fg2);transition:all .35s}
.lyr p.on{color:var(--fg);transform:scale(1.06)}
.qlist{width:100%;overflow-y:auto;max-height:100%;scrollbar-width:none}
.sheet{position:absolute;inset:auto 10px 10px;z-index:50;padding:18px;transform:translateY(120%);transition:transform .4s cubic-bezier(.2,.85,.2,1)}
.sheet.open{transform:none}
.sheet h4{margin:0 0 12px;font-size:1.1em}
.scrim{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sub{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding-top:34px;transform:translateX(-100%);transition:transform .4s cubic-bezier(.2,.85,.2,1);background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.sub.open{transform:none}
.grp{padding:6px 14px;margin:0 0 14px}
.gt{margin:16px 6px 8px;color:var(--fg2);font-size:.82em;font-weight:600;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(128,134,160,.2)}
.row:last-child{border-bottom:0}
.row .ti span{white-space:normal}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rh output{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);flex:none}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sw{width:50px;height:30px;border-radius:30px;background:rgba(128,134,160,.4);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(-20px)}
.rg{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0;direction:ltr}
.rg::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--p,0%),rgba(128,134,160,.35) var(--p,0%))}
.rg::-moz-range-track{height:6px;border-radius:6px;background:rgba(128,134,160,.35)}
.rg::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.rg::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:999px;background:rgba(128,134,160,.2);font-size:.92em}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sws button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.sws button.on{border-color:var(--fg)}
.sws input{width:36px;height:36px;border:0;padding:0;background:none;border-radius:50%}
.pres{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pres button{height:78px;border-radius:calc(var(--r)*.7);color:#fff;font-weight:700;display:flex;align-items:flex-end;padding:10px;text-shadow:0 1px 6px rgba(0,0,0,.4);border:2px solid transparent}
.pres button.on{border-color:var(--fg)}
.sq{display:flex;align-items:center;gap:8px;padding:10px 14px;margin:6px 16px 8px}
.sq input{flex:1;background:none;border:0;color:inherit;font:inherit;outline:0;min-width:0}
.eq{display:flex;justify-content:space-between;gap:4px;direction:ltr}
.eqc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75em;color:var(--fg2);flex:1}
.vs{position:relative;width:36px;height:140px}
.vs input{position:absolute;width:140px;height:36px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--accent);font-weight:600;font-size:.85em}
.toast{position:absolute;z-index:80;top:46px;left:50%;transform:translate(-50%,-30px);opacity:0;padding:10px 18px;border-radius:99px;transition:all .35s;pointer-events:none;white-space:nowrap;font-weight:500}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--fg2);padding:40px 10px}
.back{display:flex;align-items:center;gap:4px}
.note{color:var(--fg2);font-size:.82em;line-height:1.7;padding:4px 6px 10px}
@media (prefers-reduced-motion:reduce){.b,.bars i,.art.spin .cv{animation:none!important}}
</style>

<div class="stage">
<div class="phone" id="phone" data-nav="floating" aria-label="شبیه‌ساز پخش‌کننده NAVAQ">
  <div class="wall" aria-hidden="true"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
  <div class="sb"><span>۹:۴۱</span><i></i><span id="batt">۸۷٪</span></div>
  <div class="screen" id="screen"></div>
  <div class="mini glass" id="mini"></div>
  <nav class="nav glass" id="nav" aria-label="ناوبری"></nav>
  <div class="sub" id="sub"></div>
  <div class="player" id="player"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet glass" id="sheet"></div>
  <div class="toast glass" id="toast" role="status"></div>
</div>
</div>

function renderSub(keepScroll){
  var path=UI.path;if(!path.length){$sub.classList.remove("open");return}
  var id=path[path.length-1],pg=PAGES[id],old=$("#ssc"),top=old?old.scrollTop:0;
  var body;
  if(id==="root"&&UI.sq){body=searchSettings(UI.sq)}else{
    var h="",grp="";pg.items.forEach(function(it){if(it.t==="gt"){if(grp)h+='<div class="grp glass">'+grp+'</div>';grp="";h+=item(it)}else grp+=item(it)});
    if(grp)h+='<div class="grp glass">'+grp+'</div>';body=h}
  $sub.innerHTML='<div class="hd"><button class="ib back" data-act="sback" aria-label="بازگشت">'+ic("right")+'</button><h1 class="big" style="font-size:1.5em;flex:1">'+pg.t+'</h1></div>'+(id==="root"?'<div class="sq glass">'+ic("search")+'<input id="sqi" type="search" placeholder="جستجو در تنظیمات" value="'+(UI.sq||"").replace(/"/g,"")+'" autocomplete="off"></div>':"")+'<div class="scroll" id="ssc">'+body+'</div>';
  $sub.classList.add("open");if(keepScroll||old){var s=$("#ssc");if(s&&keepScroll)s.scrollTop=top}
  var qi=$("#sqi");if(qi)qi.addEventListener("input",function(){UI.sq=qi.value.trim();$("#ssc").innerHTML=UI.sq?searchSettings(UI.sq):rootBody()})
}
function rootBody(){return '<div class="grp glass">'+PAGES.root.items.map(item).join("")+'</div>'}
function searchSettings(q){var out="";Object.keys(PAGES).forEach(function(k){if(k==="root"||k==="about")return;PAGES[k].items.forEach(function(it){if(it.l&&it.t!=="gt"&&it.t!=="nav"&&(it.l+(it.d||"")).indexOf(q)>-1)out+=item(it)})});return out?'<div class="grp glass">'+out+'</div>':'<div class="empty">تنظیماتی با این نام پیدا نشد</div>'}

/* ---------- playback logic ---------- */
function play(id){P.idx=id;P.pos=0;P.playing=true;if(P.order.indexOf(id)<0)P.order.push(id);changed(true)}
function changed(full){apply();renderMini();if(P.open)renderPlayer();refreshView(full)}
function refreshView(){if(UI.screen==="library")renderLibrary();else if(UI.screen==="search")renderSearch()}
function step(d,auto){var o=P.order,i=o.indexOf(P.idx);
  if(auto&&P.repeat==="one"){P.pos=0;return}
  i+=d;if(i>=o.length){if(P.repeat==="all"||!auto)i=0;else{P.playing=false;P.pos=0;changed();return}}if(i<0)i=o.length-1;
  P.idx=o[i];P.pos=0;changed()}
function setShuffle(){P.shuffle=!P.shuffle;var ids=T.map(function(t){return t.id});if(P.shuffle){for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=ids[i];ids[i]=ids[j];ids[j]=x}ids.splice(ids.indexOf(P.idx),1);ids.unshift(P.idx)}P.order=ids;toast(P.shuffle?"پخش درهم روشن شد":"پخش درهم خاموش شد")}
setInterval(function(){
  if(P.sleepAt&&Date.now()>=P.sleepAt){P.sleepAt=0;P.playing=false;toast("تایمر خواب: پخش متوقف شد");changed();return}
  if(!P.playing)return;P.pos+=0.25*S.speed;
  if(P.pos>=cur().dur){if(P.sleepEnd){P.sleepEnd=false;P.playing=false;P.pos=0;toast("تایمر خواب: پخش متوقف شد");changed()}else step(1,true)}
  else updateProg()},250);
/* visualizer */
var vt=0;
function viz(){requestAnimationFrame(viz);var c=$("#viz");if(!c||!P.open)return;var g=c.getContext("2d"),w=c.width,h=c.height,n=32,bw=w/n;g.clearRect(0,0,w,h);
  vt+=P.playing?0.07:0;var cs=getComputedStyle($ph).getPropertyValue("--accent")||"#3e91ff";g.fillStyle=cs.trim();
  for(var i=0;i<n;i++){var e=P.playing?(0.5+0.5*Math.sin(vt*2+i*0.55))*(0.45+0.55*Math.sin(vt*0.9+i*1.7)**2)*(1-i/n*0.5):0.06;var bh=Math.max(3,e*h);
    g.globalAlpha=0.9;g.beginPath();if(g.roundRect)g.roundRect(i*bw+2,h-bh,bw-4,bh,3);else g.rect(i*bw+2,h-bh,bw-4,bh);g.fill()}}
requestAnimationFrame(viz);

/* ---------- events ---------- */
function setVal(k,v){var d=DEF[k];S[k]=typeof d==="number"?+v:v}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el){if(e.target.closest("#mini"))openPlayer();else if(e.target===$sc)closeSheet();return}
  var a=el.dataset.act,v=el.dataset.v,k=el.dataset.k;e.stopPropagation();
  switch(a){
  case "play":play(+el.dataset.id);break;
  case "fav":P.fav[el.dataset.id]?delete P.fav[el.dataset.id]:P.fav[el.dataset.id]=1;toast(P.fav[el.dataset.id]?"به علاقه‌مندی‌ها افزوده شد":"از علاقه‌مندی‌ها برداشته شد");renderMini();if(P.open)renderPlayer();refreshView();break;
  case "toggle":P.playing=!P.playing;changed();break;
  case "next":step(1);break;
  case "prev":if(P.pos>3)P.pos=0;else step(-1);updateProg();break;
  case "shuffle":setShuffle();renderPlayer();break;
  case "repeat":P.repeat={off:"all",all:"one",one:"off"}[P.repeat];toast("تکرار: "+{off:"خاموش",all:"همه",one:"یک آهنگ"}[P.repeat]);renderPlayer();break;
  case "playall":case "shufall":{var ids=el.dataset.ids.split(",").map(Number);P.order=ids;P.shuffle=a==="shufall";if(P.shuffle)ids.sort(function(){return Math.random()-.5});P.order=ids;play(ids[0]);openPlayer();break}
  case "close":closePlayer();break;
  case "view":P.view=P.view===v?"art":v;renderPlayer();break;
  case "sheet":openSheet(v);break;
  case "spd":S.speed=+v;save();openSheet("speed");break;
  case "sleep":if(v==="end"){P.sleepEnd=true;P.sleepAt=0;toast("پخش پس از این آهنگ متوقف می‌شود")}else if(+v){P.sleepAt=Date.now()+v*60000;P.sleepEnd=false;toast("تایمر خواب: "+fa(v)+" دقیقه")}else{P.sleepAt=0;P.sleepEnd=false;toast("تایمر خواب خاموش شد")}closeSheet();renderMini();if(P.open)renderPlayer();break;
  case "fx":toast("افکت «"+v+"» روی اتاق اعمال شد");break;
  case "tab":UI.tab=v;renderLibrary();break;
  case "detail":UI.detail={k:el.dataset.k,v:el.dataset.v,title:el.dataset.title};renderLibrary();break;
  case "back":UI.detail=null;renderLibrary();break;
  case "go":if(v==="settings"){UI.screen="library";UI.path=["root"];UI.sq="";renderSub()}else{UI.path=[];renderSub();UI.screen=v;UI.detail=null;renderNav();refreshView()}renderNav();break;
  case "q":UI.q=v;renderSearch();break;
  case "spage":UI.path.push(v);renderSub();break;
  case "sback":UI.path.pop();UI.sq="";renderSub();renderNav();break;
  case "tog":S[k]=!S[k];save();apply();if(UI.sheet)openSheet(UI.sheet);renderSub(true);renderMini();if(P.open)renderPlayer();refreshView();break;
  case "set":setVal(k,v);save();apply();renderSub(true);refreshView();if(P.open)renderPlayer();break;
  case "acc":S.accent=v;save();apply();renderSub(true);break;
  case "pre":{var p=PRESETS[+v];Object.keys(p.v).forEach(function(x){S[x]=p.v[x]});save();apply();renderSub(true);toast("قالب «"+p.n+"» اعمال شد");break}
  case "eqp":S.eq=EQP[v].slice();save();if(UI.sheet==="eq")openSheet("eq");renderSub(true);break;
  case "copytheme":{var j=JSON.stringify({theme:S.theme,accent:S.accent,wall:S.wall,blur:S.blur,glass:S.glass,radius:S.radius,font:S.font,art:S.art},null,1);try{navigator.clipboard.writeText(j).then(function(){toast("تنظیمات کپی شد")},function(){toast("کپی ممکن نشد")})}catch(x){toast("کپی ممکن نشد")}break}
  case "reset":S=Object.assign({},DEF);save();apply();renderSub(true);refreshView();renderMini();toast("همه تنظیمات بازنشانی شد");break;
  }
});

document.addEventListener("input",function(e){var el=e.target;
  if(el.dataset.rg){var k=el.dataset.rg;setVal(k,el.value);var it=null;Object.keys(PAGES).forEach(function(p){PAGES[p].items.forEach(function(x){if(x.k===k&&x.t==="range")it=x})});
    el.style.setProperty("--p",((el.value-it.min)/(it.max-it.min)*100)+"%");var o=$("#o-"+k);if(o)o.textContent=it.f(S[k]);save();apply();var r=$("#rt");if(r)r.textContent=fa(rt60().toFixed(2))+" ثانیه";if(k==="speed")return;if(k==="font"||k==="minLen")refreshView()}

  else if(el.id==="cc"){S.accent=el.value;save();apply()}
});
