name: NAVAQ Android CI

on:
  push:
    paths:
      - "android/**"
      - "core/**"
      - "Cargo.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - "Cargo.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"

jobs:
  android:
    name: Android debug build with Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --licenses </dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust JNI libraries
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o android/src/main/jniLibs build --release -p navaq-core
      - name: Assemble debug APK
        run: gradle :android:assembleDebug --stacktrace
